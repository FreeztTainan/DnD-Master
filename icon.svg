    <line x1="256" y1="129" x2="434" y2="154"/>
    <line x1="256" y1="129" x2="78" y2="154"/>
    <line x1="146" y1="319" x2="78" y2="358"/>
    <line x1="146" y1="319" x2="78" y2="154"/>
    <line x1="146" y1="319" x2="256" y2="461"/>
    <line x1="366" y1="319" x2="434" y2="358"/>
    <line x1="366" y1="319" x2="434" y2="154"/>
    <line x1="366" y1="319" x2="256" y2="461"/>
  </g>

  <!-- Цифра -->
  <text x="256" y="272" font-size="84" font-weight="bold" text-anchor="middle" fill="#1b1522" font-family="Georgia, serif">20</text>
